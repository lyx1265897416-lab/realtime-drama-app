<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="perhaps 新版 UI 样机：21 个可点击的界面（iPhone 17 Pro 尺寸），可切换显示或隐藏编号框，右侧是每个编号对应的功能说明，可并排对照旧版截图">
<title>perhaps 新版 UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- 外壳（和 perhaps 界面走查同一套） ---------- */
:root{--ink:#1F2329;--sub:#4E5969;--pur:#7B61E8;--purd:#5B3FD0;--purf:#F3EFFF;--gry:#F5F6F7;--line:#E3E5E8;--blk:#16181D;--g:#2F8F5B;--gf:#EAF6EF;--o:#B26A00;--of:#FFF4E0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.solo{background:#000}body.solo .app{height:100vh;border:0;border-radius:0}body.solo header,body.solo .nav,body.solo .info,body.solo .arrow,body.solo .cap{display:none}body.solo .stage{background:#000;padding:0}body.solo .frame{box-shadow:none}
html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif}
.app{width:100%;height:760px;display:flex;flex-direction:column;border:1px dashed #C9CDD4;border-radius:12px;overflow:hidden;background:#fff}
header{display:flex;align-items:center;gap:10px;padding:12px 130px 12px 16px;border-bottom:1px solid var(--line);flex:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pur);flex:none}
h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}h1 b{color:var(--pur)}
.sp{flex:1}.count{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tog{display:flex;align-items:center;gap:8px;margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tog i{width:34px;height:20px;border-radius:999px;background:#C9CDD4;position:relative;transition:background .15s;flex:none}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed="true"]{border-color:var(--pur);background:var(--purf)}
.tog[aria-pressed="true"] i{background:var(--pur)}.tog[aria-pressed="true"] i::after{left:16px}
.lsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}.lsw button{border:0;background:none;font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;cursor:pointer;color:var(--sub)}.lsw button[aria-pressed="true"]{background:var(--purf);color:var(--purd);font-weight:700}
.body{flex:1;display:flex;min-height:0}
.nav{width:168px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:#FBFBFC}
.nav .grp{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.04em;padding:8px 8px 3px}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:12.5px;color:var(--ink);padding:5px 8px;border-radius:6px;cursor:pointer}
.nav button span{display:inline-block;min-width:20px;color:var(--sub);font-variant-numeric:tabular-nums;font-size:11px}
.nav button.on{background:var(--purf);color:var(--purd);font-weight:700}
.nav button:focus-visible,.arrow:focus-visible,.tog:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gry);padding:10px 6px;position:relative}
.arrow{width:26px;height:44px;border:0;background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);font-size:18px;line-height:1;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.arrow:disabled{opacity:.3;cursor:default}
.pair{display:flex;gap:14px;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.cap{font-size:12px;color:var(--sub);font-weight:600}
.cap b{color:var(--purd)}
.frame{position:relative;overflow:hidden;border-radius:30px;box-shadow:0 8px 24px rgba(20,20,40,.2);background:#000;flex:none}
.oldimg{display:block;width:100%;height:100%;object-fit:cover}
.oldnone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#C9CDD4;font-size:13px;background:#1b1b20}
.info{width:300px;flex:none;display:flex;flex-direction:column;padding:14px 16px 12px;border-left:1px solid var(--line);min-height:0}
.crumb{font-size:12px;color:var(--sub)}
h2{font-size:18px;margin:2px 0 8px;font-weight:700}
.mkov{position:absolute;inset:0;pointer-events:none;z-index:5}
.mk{position:absolute;border:2px solid var(--pur);border-radius:7px;background:rgba(123,97,232,.12);opacity:0;transition:opacity .12s}
.mk b{position:absolute;left:-9px;top:-9px;min-width:20px;height:20px;border-radius:10px;background:var(--pur);color:#fff;font-size:11.5px;line-height:17px;text-align:center;border:1.5px solid #fff;font-weight:700;padding:0 3px}
.mkov.show .mk,.mk.peek{opacity:1}
.mk.peek{border-color:#FFB020;background:rgba(255,176,32,.18)}.mk.peek b{background:#E08A00}
.legend{flex:1;overflow:auto;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.legend li{display:flex;gap:9px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:default}
.legend li:hover{background:var(--purf)}
.legend .n{flex:none;width:21px;height:21px;border-radius:50%;background:var(--pur);color:#fff;font-size:11.5px;font-weight:700;line-height:21px;text-align:center;margin-top:1px}
.legend .t{min-width:0}.legend .t b{display:block;font-size:13.5px}.legend .t span{color:var(--sub);font-size:12.5px;display:block}
.notes{flex:1;overflow:auto;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.notes li{padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.55}
.tip{font-size:12px;color:var(--sub);margin:8px 0 0}
@media (max-width:980px){.nav{width:138px}.info{width:236px;padding:12px 12px 10px}.app.cmp .info{display:none}}
@media (max-width:560px){.app{height:auto;border:0}.body{flex-direction:column}.nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px}.nav .grp{display:none}.nav button{width:auto;white-space:nowrap;flex:none;background:var(--gry)}.stage{min-height:560px}.info{width:auto;border-left:0}.notes{max-height:300px}header{padding-right:16px}h1{font-size:15px}.count{display:none}}

/* ---------- 手机里的新版界面（402×874，iPhone 17 Pro） ---------- */
.ph{--bg:#0D0C10;--s1:#18171C;--s2:#222027;--s3:#2C2A31;--ln:rgba(255,255,255,.08);--tx:#F4EFE6;--t2:#A9A39B;--t3:#6F6A65;--g1:#EBD3A2;--g2:#B38A55;--gg:linear-gradient(135deg,#EFD9AA 0%,#C9A26A 55%,#A57D4A 100%);--hot:#D0584A;--dk:#1A140C;
  position:absolute;left:0;top:0;width:402px;height:874px;transform-origin:0 0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.ph *{box-sizing:border-box}
.ph .bb{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em}
.ph.zh .bb{font-family:"Bebas Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-weight:600;font-synthesis:none;letter-spacing:.02em}.ph.zh .kick,.ph.zh .who{letter-spacing:.06em}
.ph .scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.ph .scr::-webkit-scrollbar{display:none}
.ph [data-go]{cursor:pointer}
.ph .sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:600;font-size:16px;z-index:30;pointer-events:none}
.ph .sb .isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.ph .sb .ic{display:flex;gap:6px;align-items:center}
.ph .hi{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:rgba(255,255,255,.85);z-index:40;pointer-events:none}
.ph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ph .tb{position:absolute;left:0;right:0;bottom:0;height:84px;padding:7px 10px 0;display:flex;justify-content:space-around;background:rgba(13,12,16,.96);border-top:1px solid var(--ln);z-index:20}
.ph .tb.clear{background:linear-gradient(transparent,rgba(0,0,0,.65));border-top:0}
.ph .tb div{display:flex;flex-direction:column;align-items:center;gap:3px;width:80px;font-size:11px;color:var(--t3);font-weight:500}
.ph .tb div.on{color:var(--tx)}
.ph .tb svg{width:25px;height:25px}
.ph .tb div.on svg{fill:currentColor;stroke:currentColor}
.ph .tb div.on svg .no{fill:var(--bg)}
.ph .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px}
.ph .gold{background:var(--gg);color:var(--dk);font-weight:700}
.ph .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:25px;font-weight:700;font-size:15px;letter-spacing:.01em}
.ph .ghost{border:1px solid rgba(255,255,255,.18);color:var(--tx);background:rgba(255,255,255,.04)}
.ph .lang{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:2px;font-size:11.5px;font-weight:600}
.ph .lang span{padding:4px 8px;border-radius:999px;color:var(--t2)}.ph .lang span.on{background:rgba(255,255,255,.16);color:var(--tx)}
.ph .icbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ph .sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin:18px 0 10px}
.ph .sec h3{margin:0;font-size:17px;font-weight:700}
.ph .sec a{font-size:12.5px;color:var(--t2)}
/* 海报卡 */
.ph .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 9px;padding:0 16px}
.ph .card{min-width:0}.ph .card .pst{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--s2)}
.ph .pst img,.ph .im{width:100%;height:100%;object-fit:cover;display:block}
.ph .bdg{position:absolute;left:0;top:8px;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 6px 2px 6px;border-radius:0 5px 5px 0}
.ph .bdg.hot{background:var(--hot);color:#fff}.ph .bdg.new{background:var(--gg);color:var(--dk)}
.ph .tlk{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.ph .tlk svg{width:13px;height:13px;stroke-width:2.2}
.ph .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}.ph .prog i{display:block;height:100%;background:var(--g1)}
.ph .card h4{margin:7px 0 2px;font-size:13px;font-weight:600;line-height:1.28;height:2.56em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph .tags{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tags i{display:inline-block;width:1px;height:9px;background:var(--t3);margin:0 5px;vertical-align:-1px}
.ph .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.ph .chips::-webkit-scrollbar{display:none}
.ph .chip{flex:none;height:30px;padding:0 13px;border-radius:15px;display:flex;align-items:center;font-size:13px;color:var(--t2);white-space:nowrap}
.ph .chip.on{background:rgba(235,211,162,.14);color:var(--g1);font-weight:600}
.ph .chip.bd{border:1px solid var(--ln)}
.ph .ttabs{display:flex;gap:22px;padding:0 16px;overflow:hidden;white-space:nowrap;align-items:flex-end;height:40px}
.ph .ttabs span{font-size:17px;color:var(--t3);font-weight:600;padding-bottom:8px;position:relative;flex:none}
.ph .ttabs span.on{color:var(--tx);font-size:20px;font-weight:700}
.ph .ttabs span.on::after{content:"";position:absolute;left:50%;bottom:0;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--g1)}
.ph .srch{flex:1;height:38px;border-radius:19px;background:var(--s2);display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--t3);font-size:14px;white-space:nowrap;overflow:hidden}
.ph .srch svg{width:18px;height:18px}
.ph .vip{position:relative;height:30px;padding:0 10px 0 8px;border-radius:8px;background:var(--gg);color:var(--dk);font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px}
.ph .vip em{position:absolute;right:-6px;top:-10px;font-style:normal;font-size:10px;font-weight:800;background:var(--hot);color:#fff;border-radius:8px;padding:1px 5px}
.ph .reddot{position:absolute;right:2px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--hot);border:1.5px solid var(--bg)}
.ph .sheet{position:absolute;left:0;right:0;bottom:0;background:#141317;border-radius:22px 22px 0 0;z-index:25;padding:10px 0 40px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.ph .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.ph .dim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:24}
.ph .row{display:flex;align-items:center;gap:12px}
.ph .muted{color:var(--t2)}.ph .small{font-size:12px}
.ph .av{border-radius:50%;object-fit:cover;display:block}
.ph .vg{position:absolute;inset:0;pointer-events:none}
.ph .rail{position:absolute;right:10px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5;font-size:11.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph .rail div{display:flex;flex-direction:column;align-items:center;gap:3px}
.ph .rail svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.ph .sub{position:absolute;left:24px;right:24px;text-align:center;font-weight:700;font-size:17px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
.ph .inp{display:flex;align-items:center;gap:10px}
.ph .inp .f{flex:1;height:46px;border-radius:23px;background:rgba(20,19,24,.72);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--t2);font-size:14.5px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph .inp .go{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ph .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(20,19,24,.74);border:1px solid rgba(255,255,255,.14);font-size:14.5px;line-height:1.38;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph .opt b{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(235,211,162,.16);color:var(--g1);font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.ph .who{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--g1)}
.ph .kick{font-size:11.5px;letter-spacing:.14em;color:var(--g1);font-weight:600}
.ph .card2{background:var(--s1);border-radius:16px;border:1px solid var(--ln)}
.ph .lst{margin:0 16px;background:var(--s1);border-radius:16px}
.ph .lst>div{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--ln);font-size:15px}
.ph .lst>div:last-child{border-bottom:0}
.ph .lst svg{width:20px;height:20px;color:var(--t2)}
.ph .chev{margin-left:auto;color:var(--t3)}
.ph .coin{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--gg);color:var(--dk);font-size:10px;font-weight:900;align-items:center;justify-content:center;flex:none}
.ph .vback{position:absolute;left:12px;top:58px;z-index:6;color:rgba(255,255,255,.85);filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.ph .vrail{position:absolute;right:10px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px}
.ph .vrail>div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph .vrail svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.ph .vinfo{position:absolute;left:16px;right:72px;z-index:5;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph .vt{font-size:17px;font-weight:700;line-height:22px;display:flex;align-items:center;gap:6px}.ph .vt span{font-size:20px;font-weight:400;opacity:.85}
.ph .tchips{display:flex;gap:6px;margin:8px 0;overflow:hidden;white-space:nowrap}
.ph .tchips span{flex:none;height:24px;line-height:24px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.14);font-size:12px;color:rgba(255,255,255,.92);text-shadow:none}
.ph .tchips.wrap{flex-wrap:wrap;white-space:normal}.ph .tchips.wrap span{background:var(--s2)}
.ph .vs{font-size:13.5px;line-height:19px;color:rgba(255,255,255,.88);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph .vprog{position:absolute;left:16px;right:16px;height:2px;background:rgba(255,255,255,.25);z-index:5;border-radius:1px}
.ph .vprog i{display:block;height:100%;background:#fff;border-radius:1px}.ph .vprog b{position:absolute;top:-3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff}
.ph .epbar{position:absolute;left:12px;right:12px;bottom:40px;height:46px;border-radius:12px;background:rgba(36,34,40,.92);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:6;font-size:14px;color:var(--t2)}
.ph .epbar b{color:var(--tx);font-weight:600}.ph .epbar .up{margin-left:auto;display:flex;transform:rotate(90deg)}
.ph .watch{position:absolute;left:16px;right:72px;bottom:98px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;z-index:5}
.ph .vsheet{position:absolute;left:0;right:0;bottom:0;background:#141317;border-radius:18px 18px 0 0;z-index:25;overflow-y:auto;scrollbar-width:none}
.ph .vsheet::-webkit-scrollbar{display:none}
.ph .vipbar{position:absolute;left:12px;right:12px;top:262px;height:62px;border-radius:14px;background:var(--gg);color:var(--dk);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;z-index:27;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ph .vipbar div{display:flex;flex-direction:column;gap:2px}.ph .vipbar b{font-size:16px;line-height:20px}.ph .vipbar small{font-size:12px;line-height:16px;opacity:.75}
.ph .vipbar span{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#2A1D10;color:var(--g1);font-size:14px;font-weight:700}
.ph .vsheet.hv{padding-top:28px}
.ph .shead{display:flex;gap:12px;align-items:center;padding:16px 16px 8px;position:relative}
.ph .shead img{width:56px;height:78px;border-radius:8px;object-fit:cover;flex:none}.ph .shead div{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph .shead b{font-size:17px;line-height:22px}.ph .shead small{font-size:13px;color:var(--t2)}.ph .shead .sx{position:absolute;right:16px;top:14px;color:var(--t2)}
.ph .stabs{display:flex;gap:20px;padding:10px 16px 12px;font-size:17px;color:var(--t3)}.ph .stabs .on{color:var(--tx);font-weight:700}
.ph .rng{padding:0 16px 10px;font-size:13px;color:var(--t2)}

AIN","kicker":"A STRANGER WHO KNOWS YOU","tagline":"A repairman catches your falling sign — and smiles like he has known you forever.","hook":"Your seaside greenhouse is about to reopen. A stranger catches the sign before it hits the ground and smiles at you like an old friend. You keep the gate shut and the watering can raised. He knows your habits. You have never seen him before — or so you think.","genre":"Healing romance","rel":["Second chances","Sunshine boy"],"hero":"https://storage.googleapis.com/waku-core-aicap/uploads/usr_4a6e5fb234d64da0a9429e519b299f07/73e2d6f2bfc24926a59860f0a288b2fc/hero.jpg","cover":null,"cast":[{"id":"rowan","name":"ROWAN","av":"https://storage.googleapis.com/waku-core-aicap/uploads/usr_4a6e5fb234d64da0a9429e519b299f07/b387423e423b48b09f8febfec6f1acd1/rowan_av.jpg","img":"https://storage.googleapis.com/waku-core-aicap/uploads/usr_4a6e5fb234d64da0a9429e519b299f07/7ea6efc6f23f441dbd64deda843ef955/rowan.jpg"},{"id":"nora","name":"NORA","av":null,"img":null}],"zh":{"title":"今天，再喜欢我一次","tagline":"修理工接住了你掉下来的招牌——笑得像认识你很久。","kicker":"认识你的陌生人","hook":"海边温室的女主人隔着院门拦下一个来修招牌的陌生人洛温；他看见她时像早就认识她。真相是她事故后留不住新的记忆，而他已经这样每天重新认识她将近三个月。","genre":"治愈恋爱","rel":["每天重新认识","阳光修理工"]}},"villa":{"title":"THE VILLA","kicker":"A DATING SHOW YOU'RE IN","tagline":"Three boys. One bombshell. You.","hook":"Day 12, 4 PM. You just walked through the gate. Tonight the boys recouple and the girl nobody picks goes home. Jace already promised Sloane. Theo decided before you said a word.","genre":"Dating show","rel":["Dating show","Love triangle"],"hero":"https://storage.googleapis.com/waku-core-aicap/uploads/usr_4a6e5fb234d64da0a9429e519b299f07/2360f6492190495796518c1c2afaa78c/hero.jpg","cover":"https://storage.googleapis.com/waku-core-aicap/uploads/usr_4a6e5fb234d64da0a9429e519b299f07/1b5607f464c240d798ec791aa44bc574/cover.jpg","cast":[{"id":"jace","name":"JACE","av":"https://storage.googleapis.com/waku-core-aicap/uploads/usr_4a6e5fb234d64da0a9429e519b299f07/df5c49f7ed3b4e0 var cur=0,cmp=false;
function $(i){return document.getElementById(i);}
var ph=$('ph');
function setLang(l){if(l===LANG)return;LANG=l;setW();var bs=document.querySelectorAll('#langsw button');for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].dataset.l===l);render();}
function render(){var s=LIST[cur];ph.innerHTML=SCR[s[1]]();ph.classList.toggle('zh',LANG==='zh');
  var lgs=ph.querySelectorAll('.lang span');for(var q=0;q<lgs.length;q++)lgs[q].classList.toggle('on',(lgs[q].textContent==='中')===(LANG==='zh'));zhText(ph);
  $('crumb').textContent=s[0]+' · 第 '+(cur+1)+' / '+LIST.length+' 个界面';$('title').textContent=s[2];$('count').textContent=(cur+1)+' / '+LIST.length;
  peekI=-1;var lg=$('legend');lg.innerHTML='';s[4].forEach(function(m,i){var li=document.createElement('li');li.innerHTML='<span class="n">'+(i+1)+'</span><div class="t"><b>'+esc(m[1])+'</b><span>'+esc(m[2])+'</span></div>';
    li.onmouseenter=function(){peek(i,true);};li.onmouseleave=function(){peek(i,false);};li.onclick=function(){var d=$('mkov').children[i];peek(i,!(d&&d.classList.contains('peek')));};lg.appendChild(li);});
  marks();setTimeout(marks,400);setTimeout(marks,1500);
  var nb=document.querySelectorAll('.nav button');for(var i=0;i<nb.length;i++)nb[i].classList.toggle('on',+nb[i].dataset.i===cur);
  var of=$('oldf');of.innerHTML=s[3]&&OLD[s[3]]?'<img class="oldimg" src="'+esc(OLD[s[3]])+'" alt="旧版截图">':'<div class="oldnone">旧版没有这一屏</div>';
  $('prev').disabled=cur===0;$('next').disabled=cur===LIST.length-1;fit();}

// 编号框：按每屏的选择器找到手机里的元素，在手机外框上画框（框不跟着手机缩放，编号一样大）；sel@n = 第 n 个匹配
function pickEl(sel){var m=/^(.*)@(\d+)$/.exec(sel);var all;try{all=ph.querySelectorAll(m?m[1]:sel);}catch(e){return null;}return all[m?+m[2]:0]||null;}
function marks(){var ov=$('mkov');ov.innerHTML='';var s=LIST[cur],fr=$('newf').getBoundingClientRect();
  s[4].forEach(function(m,i){var d=document.createElement('div');d.className='mk';d.innerHTML='<b>'+(i+1)+'</b>';var el=pickEl(m[0]);
    if(el){var r=el.getBoundingClientRect();var l=Math.max(r.left,fr.left)-fr.left,t=Math.max(r.top,fr.top)-fr.top,w=Math.min(r.right,fr.right)-fr.left-l,h=Math.min(r.bottom,fr.bottom)-fr.top-t;
      if(w>2&&h>0){d.style.left=(l-2)+'px';d.style.top=(t-2)+'px';d.style.width=(w+4)+'px';d.style.height=(h+4)+'px';}else d.style.display='none';}else d.style.display='none';
    if(i===peekI)d.classList.add('peek');ov.appendChild(d);});ov.classList.toggle('show',showMk);}
function peek(i,on){peekI=on?i:(peekI===i?-1:peekI);var s=LIST[cur],el=pickEl(s[4][i][0]);if(on&&el){var sc=el.closest('.scr');if(sc){var r=el.getBoundingClientRect(),q=sc.getBoundingClientRect();if(r.top<q.top||r.bottom>q.bottom){el.scrollIntoView({block:'center'});marks();}}}
  var d=$('mkov').children[i];if(d)d.classList.toggle('peek',on);}
var showMk=false,peekI=-1;
function fit(){var st=$('stage');var solo=document.body.classList.contains('solo');var h=st.clientHeight-(solo?0:40),w=st.clientWidth-(solo?0:80);var n=cmp?2:1;
  var sc=Math.min(h/874,(w-(n-1)*14)/(402*n),solo?1.6:0.82);if(sc<0.3)sc=0.3;
  var fw=Math.round(402*sc),fh=Math.round(874*sc);
  $('newf').style.width=fw+'px';$('newf').style.height=fh+'px';$('oldf').style.width=fw+'px';$('oldf').style.height=fh+'px';
  ph.style.transform='scale('+sc+')';if($('mkov'))setTimeout(marks,0);$('newf').style.borderRadius=Math.round(56*sc)+'px';$('oldf').style.borderRadius=Math.round(56*sc)+'px';}
function buildNav(){var nv=$('nav'),last='';LIST.forEach(function(s,i){if(s[0]!==last){var g=document.createElement('div');g.className='grp';g.textContent=s[0];nv.appendChild(g);last=s[0];}
  var b=document.createElement('button');b.type='button';b.dataset.i=i;b.innerHTML='<span>'+(i<9?'0':'')+(i+1)+'</span>'+esc(s[2]);b.onclick=function(){cur=i;render();};nv.appendChild(b);});}
ph.addEventListener('click',function(e){var lg=e.target.closest('.lang span');if(lg){setLang(lg.textContent==='中'?'zh':'en');return;}var t=e.target.closest('[data-go]');if(!t)return;var id=t.getAttribute('data-go');for(var i=0;i<LIST.length;i++)if(LIST[i][1]===id){cur=i;render();return;}});
$('mtog').onclick=function(){showMk=!showMk;this.setAttribute('aria-pressed',showMk);$('mtogt').textContent=showMk?'隐藏编号框':'显示编号框';$('mkov').classList.toggle('show',showMk);};
ph.addEventListener('scroll',function(){marks();},true);
$('tog').onclick=function(){cmp=!cmp;this.setAttribute('aria-pressed',cmp);$('oldcol').hidden=!cmp;document.querySelector('.app').classList.toggle('cmp',cmp);fit();};
$('prev').onclick=function(){if(cur>0){cur--;render();}};$('next').onclick=function(){if(cur<LIST.length-1){cur++;render();}};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='ArrowRight')$('next').click();});
window.addEventListener('resize',fit);
if(/[?&]app\b/.test(location.search))document.body.classList.add('solo');
(function(){var bs=document.querySelectorAll('#langsw button');for(var i=0;i<bs.length;i++){bs[i].setAttribute('aria-pressed',bs[i].dataset.l===LANG);bs[i].onclick=function(){setLang(this.dataset.l);};}})();
buildNav();render();
</script>
